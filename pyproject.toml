[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "short-video-generator"
version = "0.1.0"
description = "Local modular pipeline for human-reviewed short video generation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
svg-api = "short_video_generator.main:run"
svg-worker = "short_video_generator.worker:run"
svg-scheduler = "short_video_generator.scheduler:run"

[tool.hatch.build.targets.wheel]
packages = ["src/short_video_generator"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
